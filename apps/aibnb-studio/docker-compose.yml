services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aibnb
      POSTGRES_PASSWORD: aibnb
      POSTGRES_DB: aibnb_studio
    ports:
      - "5432:5432"
    volumes:
      - aibnb_studio_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aibnb -d aibnb_studio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aibnb_studio_db:
